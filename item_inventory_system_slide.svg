  <text x="90" y="95" font-family="Arial, sans-serif" font-size="52" fill="#D99DF4">ITEM &amp; INVENTORY SYSTEM</text>
  <text x="92" y="150" font-family="Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="700" fill="#55DCEA">เก็บไอเทม / จัดเก็บในช่อง 1–5 / เลือกใช้และลดจำนวนคงเหลือ</text>

