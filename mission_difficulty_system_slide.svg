    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202d38"/><stop offset="1" stop-color="#17222b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#03070a" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M0 110 C400 20 700 130 960 80 S1550 0 1920 105" fill="none" stroke="#52616e" stroke-opacity=".36" stroke-width="3"/>
