<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><defs><style>@font-face{font-family:Mitr;src:url('C:/Users/Gbabuuuuuuu/Documents/GitHub/Project_K_G/Mitr-Regular.ttf')}text{font-family:Mitr,sans-serif;font-weight:400}.t{font-size:58px;fill:#dea0ff}.s{font-size:28px;fill:#50ddeb}.h{font-size:38px;fill:#fff}.b{font-size:27px;fill:#fff}.m{font-size:23px;fill:#b9cbd5}</style><linearGradient id="g" x2="1" y2="1"><stop stop-color="#202d38"/><stop offset="1" stop-color="#17222b"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#g)"/><path d="M0 100Q480 0 960 90T1920 85M0 960Q500 850 1000 945T1920 920" fill="none" stroke="#566572" stroke-opacity=".35" stroke-width="3"/><text class="t" x="90" y="100">AUDIO FEEDBACK SYSTEM</text><text class="s" x="90" y="155">CORRECT ITEM / WRONG ITEM / IMMEDIATE PLAYER RESPONSE</text><rect x="90" y="235" width="790" height="590" rx="30" fill="#103246" stroke="#50ddeb" stroke-width="4"/><circle cx="485" cy="365" r="74" fill="#50ddeb"/><path d="M451 365l23 23 45-54" fill="none" stroke="#103246" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text class="h" x="295" y="505">CORRECT ITEM</text><text class="s" x="218" y="550">เสียงยืนยันเมื่อใช้น้ำยาตรงกับคราบ</text><line x1="155" y1="595" x2="815" y2="595" stroke="#50ddeb" stroke-opacity=".55" stroke-width="2"/><text class="b" x="175" y="655">• คราบหายและ HUD อัปเดต</text><text class="b" x="175" y="710">• เล่นเสียงตอบรับเชิงบวก</text><text class="m" x="175" y="765">ช่วยยืนยันว่าผู้เล่นวิเคราะห์ได้ถูกต้อง</text><rect x="1040" y="235" width="790" height="590" rx="30" fill="#282543" stroke="#dea0ff" stroke-width="4"/><circle cx="1435" cy="365" r="74" fill="#dea0ff"/><path d="M1402 332l66 66m0-66l-66 66" stroke="#282543" stroke-width="16" stroke-linecap="round"/><text class="h" x="1265" y="505">WRONG ITEM</text><text x="1203" y="550" font-family="Mitr" font-size="28" fill="#dea0ff">เสียงเตือนเมื่อใช้ไอเทมไม่ตรงกับคราบ</text><line x1="1105" y1="595" x2="1765" y2="595" stroke="#dea0ff" stroke-opacity=".55" stroke-width="2"/><text class="b" x="1125" y="655">• ลดจำนวนการใช้ไอเทม 1 ครั้ง</text><text class="b" x="1125" y="710">• Pop-up แจ้งเตือนและเล่นเสียงผิดพลาด</text><text class="m" x="1125" y="765">สร้างผลลัพธ์ชัดเจน โดยไม่ทำให้ผู้เล่นสับสน</text><text class="s" x="90" y="915">FEEDBACK LOOP</text><path d="M185 980h390m-20-20 20 20-20 20M690 980h390m-20-20 20 20-20 20M1195 980h390m-20-20 20 20-20 20" stroke="#50ddeb" stroke-width="5" fill="none"/><text class="b" x="110" y="1040">USE ITEM</text><text class="b" x="650" y="1040">HEAR RESULT</text><text class="b" x="1195" y="1040">ADJUST DECISION</text></svg>
